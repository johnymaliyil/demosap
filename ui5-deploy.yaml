specVersion: "4.0"
metadata:
  name: physicalinventory
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true
        target:
          # Direct URL to your system, same "dw4" landscape as the
          # dw4-bas destination used in ui5.yaml for local preview.
          url: https://dw4.sap.solar.eu:44300
          client: "100"
        app:
          # BSP application name in the ABAP UI5 repository — must respect
          # your system's customer namespace (e.g. Z_/Y_ prefix), max 15 chars.
          name: ZDEMO_PHYSINV
          description: EWM Physical Inventory demo
          # ABAP package to deploy into (must exist; $TMP cannot be
          # transported to other systems).
          package: ZDEMO_EWM
          # Transport request for THIS app's deployment — get your own via
          # SE09/SE10 (or let the deploy prompt create one), don't reuse a
          # transport that belongs to a different app/change.
          transport: ""
        exclude:
          - /test/
